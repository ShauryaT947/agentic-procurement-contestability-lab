name: Python CI

on:
  pull_request:
  push:
    branches:
      - main
      - "phase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Controls, reproducibility, and validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared development requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python paths
        run: python -m compileall -q src scripts tests

      - name: Run Phase 1 validation tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate synthetic fixtures
        run: python scripts/generate_synthetic_data.py

      - name: Confirm generated fixtures are unchanged
        run: git diff --exit-code -- data/synthetic
